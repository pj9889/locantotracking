<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPA Analytics Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .dashboard-container { 
            width: 100%;
            max-width: 600px; 
            background-color: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
            text-align: center;
        }
        h2 { 
            color: #38bdf8; 
            margin-bottom: 20px; 
            font-size: 22px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        .iframe-wrapper {
            position: relative;
            width: 100%;
            height: 320px;
            border-radius: 12px;
            overflow: hidden;
            background: #0f172a;
            border: 2px dashed #334155;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .btn-group { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            margin-top: 20px; 
        }
        .btn { 
            flex: 1;
            padding: 14px; 
            font-size: 15px; 
            font-weight: bold; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        .btn-refresh { 
            background-color: #38bdf8; 
            color: #0f172a; 
        }
        .btn-refresh:hover { 
            background-color: #0ea5e9; 
        }
        .btn-clear { 
            background-color: #ef4444; 
            color: #fff; 
        }
        .btn-clear:hover { 
            background-color: #dc2626; 
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h2>Locanto Live Traffic Tracking</h2>
        
        <!-- এই আইফ্রেমটি সরাসরি গুগলের সিকিউর সার্ভার থেকে মোবাইলের স্ক্রিনে লাইভ ডেটা এনে দেখাবে -->
        <div class="iframe-wrapper">
            <iframe id="statsFrame" src="https://script.google.com/macros/s/AKfycbwdznBMxJog_To63rCIln_szACsWet-P3W9-RO6XwfFuLANAHpvlI1NOtv4k5bNM9Xf/exec?action=getStats">
                Loading Live Data...
            </iframe>
        </div>

        <div class="btn-group">
            <button class="btn btn-refresh" onclick="refreshDashboard()">Refresh Data</button>
            <button class="btn btn-clear" onclick="clearDashboardData()">Clear Data</button>
        </div>
    </div>

    <script>
        // রিফ্রেশ বাটন চাপলে আইফ্রেমটি রিলোড হয়ে নতুন ডেটা নিয়ে আসবে
        function refreshDashboard() {
            var iframe = document.getElementById('statsFrame');
            // ক্যাশ এড়ানোর জন্য লিংকের শেষে টাইমস্ট্যাম্প যোগ করা হলো
            iframe.src = "https://script.google.com/macros/s/AKfycbwdznBMxJog_To63rCIln_szACsWet-P3W9-RO6XwfFuLANAHpvlI1NOtv4k5bNM9Xf/exec?action=getStats&t=" + new Date().getTime();
        }

        // ক্লিয়ার বাটনের কাজ
        function clearDashboardData() {
            if (confirm("Are you sure you want to clear/reset data? (Note: It will clear the actual sheet counter if supported by script)")) {
                alert("Please clear your Google Sheet rows manually to completely reset the main data.");
                refreshDashboard();
            }
        }
        
        // প্রতি ১০ সেকেন্ড পর পর অটোমেটিক মোবাইল ড্যাশবোর্ড আপডেট হবে
        setInterval(refreshDashboard, 10000);
    </script>
</body>
</html>
