<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPA Analytics Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 30px;
        }
        .dashboard-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 30px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border: 1px solid #334155;
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .card .count {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
        }
        .card.visits { border-top: 4px solid #38bdf8; }
        .card.nexts { border-top: 4px solid #fbbf24; }
        .card.clicks { border-top: 4px solid #f43f5e; }
        
        .btn-refresh {
            display: block;
            width: 150px;
            margin: 0 auto;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-refresh:hover {
            background-color: #0ea5e9;
            transform: scale(1.03);
        }
        .loading {
            text-align: center;
            color: #94a3b8;
            font-style: italic;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h2>Locanto Live Traffic Tracking</h2>
        
        <div class="grid">
            <div class="card visits">
                <h3>Total Visits</h3>
                <div class="count" id="totalVisits">0</div>
            </div>
            <div class="card nexts">
                <h3>Next Button Clicks</h3>
                <div class="count" id="nextClicks">0</div>
            </div>
            <div class="card clicks">
                <h3>Profile Complete Clicks</h3>
                <div class="count" id="profileClicks">0</div>
            </div>
        </div>

        <button class="btn-refresh" onclick="loadStats()">Refresh Data</button>
        <div class="loading" id="loadingText" style="display:none;">Fetching live data...</div>
    </div>

    <script>
        var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxfV8qYvEQIYGNq5DZi6EVwHZJU9HDzkntHglcims-3X6K0oV1FaLXYfgkVk0jAhEtb/exec";

        function loadStats() {
            document.getElementById('loadingText').style.display = 'block';
            
            fetch(SCRIPT_URL + "?action=getStats")
                .then(response => response.json())
                .then(data => {
                    document.getElementById('totalVisits').innerText = data.visits;
                    document.getElementById('nextClicks').innerText = data.nextClicks;
                    document.getElementById('profileClicks').innerText = data.profileClicks;
                    document.getElementById('loadingText').style.display = 'none';
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    document.getElementById('loadingText').innerText = "Error loading data. Check console.";
                });
        }

        window.onload = loadStats;
    </script>
</body>
</html>
